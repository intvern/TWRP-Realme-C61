name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        required: true
        default: 'twrp-14.1'
        type: choice
        options: ['twrp-14.1', 'twrp-12.1', 'twrp-11']
      DEVICE_TREE:
        required: true
        default: 'https://github.com/intvern/REALME-C61-DEVICE-TREE-TWRP'
      DEVICE_TREE_BRANCH:
        required: true
        default: 'main'
      DEVICE_PATH:
        required: true
        default: 'device/realme/ussi_arm64'
      DEVICE_NAME:
        required: true
        default: 'ussi_arm64'
      BUILD_TARGET:
        required: true
        default: 'vendorboot'
        type: choice
        options: ['boot', 'recovery', 'vendorboot']

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3

    - name: Prepare Environment
      run: |
        sudo apt update
        sudo apt -y install gperf gcc-multilib g++-multilib libxml2-utils xsltproc bc ccache liblz4-tool libncurses5-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libgflags-dev python3
        mkdir ~/bin && curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo && sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize & Sync Repo
      run: |
        mkdir -p workspace && cd workspace
        echo "=== Структура папок после создания workspace ==="
        ls -la
        
        git config --global user.name "intvern" && git config --global user.email "intvern@email.com"
        
        # Загрузка полноценного манифеста (включая build/) в неглубоком режиме
        repo init --depth=1 --no-clone-bundle -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -c -j$(nproc --all) --force-sync --no-tags --no-clone-bundle

    - name: Clone Device Tree & Check Makefile
      run: |
        cd workspace
        echo "=== Структура папок в workspace перед клонированием дерева ==="
        ls -la
        
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} open_tree
        if [ -d "open_tree/device" ]; then
            echo "Обнаружена вложенная структура папок. Переносим файлы..."
            cp -r open_tree/device/* device/ 2>/dev/null || true
            rm -rf open_tree
        else
            echo "Обнаружена плоская структура. Переносим в целевой путь..."
            mkdir -p ${{ github.event.inputs.DEVICE_PATH }}
            mv open_tree/* ${{ github.event.inputs.DEVICE_PATH }}/ 2>/dev/null || true
            rm -rf open_tree
        fi
        
        echo "=== Проверка структуры целевой папки устройства ==="
        ls -la ${{ github.event.inputs.DEVICE_PATH }}
        
        rm -f "${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh"

        if [ -f "${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME }}.mk" ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk" ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "::error::Критическая ошибка: Файл конфигурации .mk не найден!" && exit 1
        fi

    - name: Building Image 
      run: |
        cd $GITHUB_WORKSPACE/workspace
        echo "=== Структура папок в workspace перед запуском компиляции ==="
        ls -la
        
        if [ ! -f "build/envsetup.sh" ]; then
            echo "::error::Критическая ошибка: Файл build/envsetup.sh не найден!" && exit 1
        fi
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        MAKE_TARGET="${{ github.event.inputs.BUILD_TARGET }}image"
        [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ] && MAKE_TARGET="vendorbootimage"
        
        lunch ${{ env.DEVICE_MAKEFILE }}-trunk_staging-userdebug && make $MAKE_TARGET -j$(nproc --all)

    - name: Verify & Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
        fail_on_unmatched_files: false
