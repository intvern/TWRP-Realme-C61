name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        required: true
        default: 'twrp-14.1'
        type: choice
        options: ['twrp-14.1', 'twrp-12.1', 'twrp-11']
      DEVICE_TREE:
        required: true
        default: 'https://github.com/intvern/REALME-C61-DEVICE-TREE-TWRP'
      DEVICE_TREE_BRANCH:
        required: true
        default: 'main'
      DEVICE_PATH:
        required: true
        default: 'device/realme/ussi_arm64'
      DEVICE_NAME:
        required: true
        default: 'ussi_arm64'
      BUILD_TARGET:
        required: true
        default: 'vendorboot'
        type: choice
        options: ['boot', 'recovery', 'vendorboot']

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3

    - name: Prepare Environment
      run: |
        sudo apt update && sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev
        sudo add-apt-repository -y universe && sudo apt -y install libncurses5
        mkdir ~/bin && curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo && sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize & Sync Repo
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "intvern" && git config --global user.email "intvern@email.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree & Check Makefile
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}
        
        if [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk" ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f "${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME }}.mk" ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "::error::No recovery makefile found!" && exit 1
        fi

    - name: Building Image 
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        MAKE_TARGET="${{ github.event.inputs.BUILD_TARGET }}image"
        [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ] && MAKE_TARGET="vendorbootimage"
        
        lunch ${{ env.DEVICE_MAKEFILE }}-userdebug && make clean && make $MAKE_TARGET -j$(nproc --all)

    - name: Verify & Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
        fail_on_unmatched_files: false
